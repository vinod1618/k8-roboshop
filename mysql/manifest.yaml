apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  # these lables are replica set lables
  labels:
    project: roboshop
    tier: database
    component: mysql
spec:
  replicas: 1
  selector:
  # using these labels replica set selects the pod
    matchLabels:
      project: roboshop
      tier: database
      component: mysql
# This is pod definition. pod is subset of replica set
  template:
    metadata:
      labels:
        project: roboshop
        tier: database
        component: mysql
    spec:
      containers:
      - name: mysql
        image: vinod1618/mysql:1.6.0

---

apiVersion: v1
kind: Service
metadata: 
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    tier: database
    component: mysql
spec:
  selector:
  #lables are used as selectors
    project: roboshop
    tier: database
    component: mysql
  ports:
    - protocol: TCP
      port: 3306 # service port
      targetPort: 3306 # container port